# Codemagic 构建配置
#
# 两个工作流：
#   enterprise-ipa  → 用你自己的企业证书签好名的 ipa，直接可分发（你要的是这个）
#   unsigned-ipa    → 未签名 ipa，留给你自己的签名软件用
#
# 前置（企业证书工作流，只需要配一次）：
#   Codemagic → Team settings → codemagic.yaml settings → Code signing identities
#   → iOS certificates         上传你的 .p12（有密码就填密码）
#   → iOS provisioning profiles 上传你的企业 .mobileprovision
#   然后本文件里 ios_signing 的 distribution_type: enterprise 会自动匹配到它们。

workflows:
  enterprise-ipa:
    name: 企业证书签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: enterprise
        # ⚠️ 必须改成你企业描述文件对应的 bundle id
        bundle_identifier: com.taskpilot.app
      vars:
        # ⚠️ 和上面 bundle_identifier 保持一致
        BUNDLE_ID: "com.taskpilot.app"
        XCODE_PROJECT: "TaskPilot.xcodeproj"
        XCODE_SCHEME: "TaskPilot"
        APP_NAME: "TaskPilot"
      xcode: latest
    scripts:
      - name: 安装 XcodeGen
        script: |
          set -e
          brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        script: |
          set -e
          xcodegen generate --spec project.yml

      - name: 写入签名配置
        script: |
          set -e
          xcode-project use-profiles

      - name: 构建并导出 ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"

      - name: 检查签名结果
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "产物：$IPA"
          unzip -o -q "$IPA" -d /tmp/ipa_check
          APP=$(ls -d /tmp/ipa_check/Payload/*.app | head -n 1)
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "描述文件: $(test -f "$APP/embedded.mobileprovision" && echo 已嵌入 || echo 缺失)"
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null | grep -A1 -E 'ProvisionsAllDevices|ExpirationDate' || true
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  unsigned-ipa:
    name: 生成未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "com.taskpilot.app"
        XCODE_PROJECT: "TaskPilot.xcodeproj"
        XCODE_SCHEME: "TaskPilot"
        APP_NAME: "TaskPilot"
      xcode: latest
    scripts:
      - name: 安装 XcodeGen
        script: |
          set -e
          brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        script: |
          set -e
          xcodegen generate --spec project.yml

      - name: 编译（完全不签名）
        script: |
          set -e
          rm -rf build
          mkdir -p build
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/${APP_NAME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: 打包成 ipa
        script: |
          set -e
          APP_PATH="build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app"
          test -d "$APP_PATH"
          rm -rf build/Payload build/*.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr "${APP_NAME}-unsigned.ipa" Payload
          cd ..
    artifacts:
      - build/*.ipa
      - build/*.xcarchive

    # 想跳过签名、直接传 TestFlight 时，取消下面注释并配好三个环境变量。
    # publishing:
    #   app_store_connect:
    #     api_key: $APP_STORE_CONNECT_PRIVATE_KEY
    #     key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
    #     issuer_id: $APP_STORE_CONNECT_ISSUER_ID
