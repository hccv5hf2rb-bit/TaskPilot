# Codemagic 构建配置
#
# 两个工作流：
#   adhoc-ipa     → 用你自己的 Ad Hoc 证书签好名的 ipa（你手上的描述文件就是这个类型）
#   unsigned-ipa  → 未签名 ipa，留给你自己的签名软件用
#
# 前置（签名工作流，只需要配一次）：
#   Codemagic → Team settings → codemagic.yaml settings → Code signing identities
#   → iOS certificates         上传你的 .p12（有密码就填密码）
#   → iOS provisioning profiles 上传你的 .mobileprovision
#
# ⚠️ 这个描述文件是 Ad Hoc 类型，ProvisionedDevices 里只有一台设备：
#    00008150-000C15EE0CA1401C
#    所以签出来的包只能装那台 iPhone，别人手机装不上。
#    它的 App ID 是具体的 QZ4F9UXK6V.app.otter4980.chickpea4593，
#    因此 App 的 bundle id 必须写成 app.otter4980.chickpea4593，不能自定义。

workflows:
  adhoc-ipa:
    name: Ad Hoc 签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: app.otter4980.chickpea4593
      vars:
        BUNDLE_ID: "app.otter4980.chickpea4593"
        XCODE_PROJECT: "TaskPilot.xcodeproj"
        XCODE_SCHEME: "TaskPilot"
        APP_NAME: "TaskPilot"
      xcode: latest
    scripts:
      - name: 安装 XcodeGen
        script: |
          set -e
          brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        script: |
          set -e
          xcodegen generate --spec project.yml

      - name: 写入签名配置
        script: |
          set -e
          xcode-project use-profiles

      - name: 构建并导出 ipa
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-xcargs "PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID"

      - name: 检查签名结果
        script: |
          set -e
          IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
          echo "产物：$IPA"
          unzip -o -q "$IPA" -d /tmp/ipa_check
          APP=$(ls -d /tmp/ipa_check/Payload/*.app | head -n 1)
          echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "描述文件: $(test -f "$APP/embedded.mobileprovision" && echo 已嵌入 || echo 缺失)"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  unsigned-ipa:
    name: 生成未签名 IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      vars:
        BUNDLE_ID: "app.otter4980.chickpea4593"
        XCODE_PROJECT: "TaskPilot.xcodeproj"
        XCODE_SCHEME: "TaskPilot"
        APP_NAME: "TaskPilot"
      xcode: latest
    scripts:
      - name: 安装 XcodeGen
        script: |
          set -e
          brew install xcodegen || brew upgrade xcodegen

      - name: 生成 Xcode 工程
        script: |
          set -e
          xcodegen generate --spec project.yml

      - name: 编译（完全不签名）
        script: |
          set -e
          rm -rf build
          mkdir -p build
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/${APP_NAME}.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID"

      - name: 打包成 ipa
        script: |
          set -e
          APP_PATH="build/${APP_NAME}.xcarchive/Products/Applications/${APP_NAME}.app"
          test -d "$APP_PATH"
          rm -rf build/Payload build/*.ipa
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr "${APP_NAME}-unsigned.ipa" Payload
          cd ..
    artifacts:
      - build/*.ipa
      - build/*.xcarchive
